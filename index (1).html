<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">

<style>
/* ===== DESIGN TOKENS ===== */
:root{
  --bg:#050a1c;--bg2:#0a1330;--card:rgba(18,28,64,.72);--glass:rgba(255,255,255,.05);
  --line:rgba(120,160,255,.18);--line-strong:rgba(90,200,255,.45);
  --blue:#3b82f6;--cyan:#22d3ee;--violet:#8b5cf6;--gold:#fbbf24;--green:#34d399;--red:#f87171;
  --text:#eaf1ff;--muted:#93a4c8;--faint:#5d6e96;
  --grad:linear-gradient(135deg,#2563eb,#22d3ee);--grad2:linear-gradient(135deg,#6d28d9,#3b82f6);
  --glow:0 0 22px rgba(34,211,238,.28);
  --r1:10px;--r2:16px;--r3:24px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --font:'Noto Sans Bengali','Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:68px;--avbg:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),rgba(5,10,28,.85));
}
[data-theme="light"]{
  --bg:#eef3ff;--bg2:#e2eaff;--card:rgba(255,255,255,.9);--glass:rgba(37,99,235,.06);
  --line:rgba(37,99,235,.18);--line-strong:rgba(37,99,235,.5);--avbg:radial-gradient(circle at 30% 25%,#ffffff,#cfdcff);
  --text:#0f1b3d;--muted:#46557f;--faint:#7a88ad;--glow:0 0 16px rgba(37,99,235,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;overflow:hidden}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(700px 500px at 15% 10%,rgba(59,130,246,.18),transparent 70%),
             radial-gradient(600px 420px at 90% 90%,rgba(139,92,246,.16),transparent 70%),
             radial-gradient(500px 360px at 80% 15%,rgba(34,211,238,.1),transparent 70%)}
.low-gfx .bg-mesh{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== LAYOUT ===== */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s4) var(--s4) calc(var(--nav-h) + var(--s5));-webkit-overflow-scrolling:touch}
#view.full{padding-bottom:var(--s5)}
.center-screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s4);padding:var(--s5)}
h1{font-size:24px;font-weight:700;line-height:1.25}h2{font-size:18px;font-weight:700;margin:var(--s5) 0 var(--s3)}h3{font-size:15px;font-weight:600}
.muted{color:var(--muted);font-size:14px}.faint{color:var(--faint);font-size:12px}
.row{display:flex;align-items:center;gap:var(--s3)}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
@media(min-width:560px){.gridm{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.low-gfx .card{backdrop-filter:none;-webkit-backdrop-filter:none}
.card.glow{border-color:var(--line-strong);box-shadow:var(--glow)}
.low-gfx .card.glow{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--glass);border:1px solid var(--line);color:var(--muted)}
.pill.gold{color:var(--gold);border-color:rgba(251,191,36,.4)}
.pill.warn{color:var(--gold);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}

/* ===== BUTTONS / INPUTS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--r1);border:1px solid transparent;
  background:var(--grad);color:#fff;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.full{width:100%}.btn.ghost{background:var(--glass);border-color:var(--line);color:var(--text)}
.btn.danger{background:transparent;border-color:rgba(248,113,113,.55);color:var(--red)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.reduced .btn,.reduced *{transition:none!important;animation:none!important}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r1);
  background:var(--glass);border:1px solid var(--line);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
select option{background:var(--bg2);color:var(--text)}
textarea{min-height:80px;resize:vertical}
.err{color:var(--red);font-size:13px;min-height:18px}
.tabs{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r1);padding:4px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input[type=checkbox]{width:44px;height:26px;accent-color:var(--cyan)}
input[type=range]{width:100%;accent-color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);cursor:pointer;color:var(--text)}
.chip[aria-pressed="true"],.chip.active{background:var(--grad);border-color:transparent;color:#fff}
.btn.ok{background:var(--green);color:#fff}
.opt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{aspect-ratio:1;border-radius:var(--r2);border:2px solid var(--line);background:var(--glass);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.opt[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow);background:rgba(34,211,238,.1)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av-grid .opt{font-size:0;padding:6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--text)}

.subj:hover{border-color:var(--line-strong)}
.badge{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px}

.choice{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin-bottom:10px;border-radius:var(--r1);border:2px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer;font-size:16px}

.lv.done{border-color:var(--green);background:rgba(52,211,153,.12)}
.lv.cur{border-color:var(--cyan);box-shadow:var(--glow);background:rgba(34,211,238,.14)}
.lv.lock{opacity:.5;cursor:not-allowed}
.badge.sm{font-size:11px}
.matrix{overflow-x:auto}.matrix table{border-collapse:collapse;font-size:12px;width:100%}.matrix th,.matrix td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
/* ===== PROGRESS / STATS ===== */
.bar{height:10px;border-radius:99px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);text-align:center}
.stat b{display:block;font-size:22px;font-family:'Rajdhani',var(--font)}.stat span{font-size:12px;color:var(--muted)}
.avatar{border-radius:50%;background:var(--avbg);border:2px solid var(--line-strong);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none}
.empty{text-align:center;padding:var(--s5) var(--s3);color:var(--muted);font-size:14px}
.empty svg{opacity:.7;margin-bottom:8px}
.mod{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;text-align:center;min-height:104px;cursor:pointer;border:1px solid var(--line);border-radius:var(--r2);background:var(--glass);color:var(--text)}
.mod[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.mod small{font-size:11px;color:var(--faint)}

/* ===== NAV / OVERLAYS ===== */
#bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:760px;height:var(--nav-h);display:flex;
  background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.low-gfx #bnav{backdrop-filter:none;background:var(--bg2)}
#bnav button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer;min-height:48px}
#bnav button[aria-current="page"]{color:var(--cyan)}
.overlay{position:fixed;inset:0;background:rgba(2,6,20,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:85vh;overflow:auto;background:var(--bg2);border:1px solid var(--line-strong);border-radius:var(--r3) var(--r3) 0 0;padding:var(--s5) var(--s4) var(--s6)}
.dialog{align-self:center;border-radius:var(--r3);margin:var(--s4);width:calc(100% - 32px)}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:calc(100% - 24px);max-width:420px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--line-strong);border-radius:var(--r1);padding:10px 14px;font-size:14px;animation:tin .25s}
.toast.error{border-color:var(--red)}.toast.ok{border-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--cyan);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--glass),rgba(255,255,255,.1),var(--glass));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--r1);height:16px}
@keyframes sk{to{background-position:-200% 0}}
.logo-float{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.fade-in{animation:fi .35s}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.low-gfx *{animation-duration:0s!important}
.brand{font-family:'Rajdhani',var(--font);font-weight:700;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{display:flex;gap:6px;margin-bottom:var(--s4)}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--grad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>/* LevelUp 60% core — DISPLAY/local gating only; the trusted copy runs in Cloud Functions */
'use strict';
/* LevelUp Academy — 60% lesson-completion core (pure logic, no I/O).
   Used by the trusted backend (functions/index.js). A copy may be used in the browser for DISPLAY only;
   the client's result is never trusted. */
const THRESHOLD_PERCENT = 60;          // exact rule: >= 60% unlocks, 59% does not
const SCALE = 1e6;                     // integer math, avoids float errors
const toUnits = w => Math.round(Number(w) * SCALE);

/* Only REQUIRED activities with a positive weight count. Optional ones never inflate completion. */
function requiredActivities(config){
  const list = config && Array.isArray(config.activities) ? config.activities : [];
  return list.filter(a => a && a.required !== false && Number.isFinite(+a.weight) && +a.weight > 0);
}

/* A record is {done:true, scorePercent?}. A quiz with minScorePercent also needs that score.
   No minScorePercent => attempting is enough (a perfect score is never required by default). */
function isActivityDone(activity, rec){
  if(!rec || rec.done !== true) return false;
  if(activity.minScorePercent != null) return Number(rec.scorePercent) >= Number(activity.minScorePercent);
  return true;
}

/* Weights normalised to 100% over the required activities (for showing the formula). */
function normalizeWeights(config){
  const req = requiredActivities(config), total = req.reduce((s,a)=>s+toUnits(a.weight),0);
  return req.map(a => ({ id:a.id, type:a.type, weightPercent: total ? toUnits(a.weight) * 100 / total : 0 }));
}

function calcCompletion(config, records){
  const req = requiredActivities(config), total = req.reduce((s,a)=>s+toUnits(a.weight),0);
  if(!req.length || total <= 0) return { valid:false, percent:0, met:false, completedCount:0, requiredCount:0, items:[] };
  let done = 0, count = 0;
  const items = req.map(a => {
    const ok = isActivityDone(a, records && records[a.id]);   // unknown/fabricated ids in `records` are ignored
    if(ok){ done += toUnits(a.weight); count++; }
    return { id:a.id, type:a.type, weightPercent: toUnits(a.weight) * 100 / total, done: ok };
  });
  return { valid:true, percent: Math.floor(done * 100 / total), met: done * 100 >= THRESHOLD_PERCENT * total,
           completedCount: count, requiredCount: req.length, items };
}

/* `met` is sticky: once a lesson reached 60% it stays met, even if the admin later changes the config. */
function evaluateLesson(config, progress){
  const c = calcCompletion(config, progress && progress.activities);
  return Object.assign({}, c, { met: c.met || !!(progress && progress.met) });
}

/* Published, non-archived lessons of published units, in unit order then lesson order. */
function orderedLessons(cur){
  const ok = s => s && s.status === 'published';
  const units = (cur.units || []).filter(ok).sort((a,b)=>a.order-b.order);
  const out = [];
  units.forEach(u => (cur.lessons || []).filter(l => l.unitId === u.id && ok(l)).sort((a,b)=>a.order-b.order).forEach(l => out.push(l)));
  return out;
}

/* Access map for ONE subject (subjects progress independently). Default rule: lesson N needs lesson N-1 met;
   first lesson of the next unit follows the last lesson of the previous unit. Explicit `prerequisites`
   (published lesson ids) replace the default for that lesson. Persisted unlocks are never removed. */
function computeAccess(cur, progressByLesson, persistedUnlocks){
  const seq = orderedLessons(cur), pub = new Set(seq.map(l => l.id)), byId = {};
  seq.forEach(l => byId[l.id] = l);
  const prog = progressByLesson || {}, kept = new Set(persistedUnlocks || []);
  const metOf = id => !!byId[id] && evaluateLesson(byId[id].config, prog[id]).met;
  const status = {};
  seq.forEach((l, i) => {
    const pre = (l.prerequisites || []).filter(id => pub.has(id));
    const eligible = pre.length ? pre.every(metOf) : (i === 0 || metOf(seq[i-1].id));
    status[l.id] = Object.assign({ unlocked: eligible || kept.has(l.id), eligible }, evaluateLesson(l.config, prog[l.id]));
  });
  return status;   // lessons not listed (unpublished/archived/deleted) are NOT accessible
}
const canAccess = (cur, lessonId, prog, kept) => !!(computeAccess(cur, prog, kept)[lessonId] || {}).unlocked;

/* Records one activity. Idempotent: XP is granted only the first time the activity is recorded. */
function applyActivity(progress, config, activityId, extra, nowIso){
  const act = ((config && config.activities) || []).find(a => a.id === activityId);
  if(!act) return { error:'UNKNOWN_ACTIVITY', progress, xp:0 };
  const p = JSON.parse(JSON.stringify(progress || {}));
  p.activities = p.activities || {};
  const prev = p.activities[activityId], score = extra && extra.scorePercent != null ? Number(extra.scorePercent) : undefined;
  let xp = 0;
  if(!prev){ p.activities[activityId] = { done:true, at:nowIso }; if(score != null) p.activities[activityId].scorePercent = score; xp = Number(act.xp) || 0; }
  else if(score != null && !(score <= (prev.scorePercent || 0))) prev.scorePercent = score;   // keep best score; no extra XP
  const ev = evaluateLesson(config, p), wasMet = !!p.met;
  p.met = ev.met; p.percent = ev.percent; p.configVersion = config.version;
  if(ev.met && !p.metAt) p.metAt = nowIso;
  return { progress:p, xp, evaluation:ev, newlyMet: ev.met && !wasMet };
}

/* Config change: keep completed activity ids that still exist, keep sticky `met`, never wipe progress. */
function migrateProgress(progress, newConfig){
  const ids = new Set(((newConfig && newConfig.activities) || []).map(a => a.id)), p = JSON.parse(JSON.stringify(progress || {}));
  p.activities = p.activities || {};
  p.retiredActivities = Object.assign({}, p.retiredActivities);
  Object.keys(p.activities).forEach(id => { if(!ids.has(id)){ p.retiredActivities[id] = p.activities[id]; delete p.activities[id]; } });
  const ev = evaluateLesson(newConfig, p);
  p.percent = ev.percent; p.met = ev.met; p.configVersion = newConfig.version;
  return p;
}

const api = { THRESHOLD_PERCENT, requiredActivities, isActivityDone, normalizeWeights, calcCompletion, evaluateLesson,
              orderedLessons, computeAccess, canAccess, applyActivity, migrateProgress };
if(typeof module !== 'undefined' && module.exports) module.exports = api; else globalThis.LevelUpCore = api;

</script>

/* ---------- PURE LOGIC (unit-tested in tests/core.test.js) ---------- */
const MAX_PLAYER_NO = 999999999;
function formatPlayerId(n){
  if(!Number.isInteger(n) || n < 1 || n > MAX_PLAYER_NO) throw new RangeError('PLAYER_ID_RANGE');
  return String(n).padStart(9,'0');
}
function parsePlayerId(s){
  if(typeof s !== 'string' || !/^\d{9}$/.test(s) || s === '000000000') return null;
  return parseInt(s,10);
}
const xpForLevel = L => 50 * L * (L - 1);              // total XP needed to REACH level L
function levelFromXp(xp){
  xp = Math.max(0, Math.floor(Number(xp) || 0));
  let L = Math.floor((1 + Math.sqrt(1 + xp / 12.5)) / 2);
  while(xpForLevel(L + 1) <= xp) L++;
  while(L > 1 && xpForLevel(L) > xp) L--;
  return L;
}
function levelProgress(xp){
  xp = Math.max(0, Math.floor(Number(xp) || 0));
  const L = levelFromXp(xp), a = xpForLevel(L), b = xpForLevel(L + 1);
  return { level:L, into:xp - a, need:b - a, pct:(xp - a) / (b - a) * 100 };
}
const CLASSES = [6,7,8,9,10];
function validateDisplayName(s){
  s = String(s || '').trim().replace(/\s+/g,' ');
  if(s.length < 2 || s.length > 20) return null;
  if(/[<>&"'`\\\/]/.test(s)) return null;
  return s;
}

const UNLOCK_MIN_CORRECT = 0;   // correct answers (of 5) needed to complete a level and unlock the next. 0 = just finish the level.
const MAX_LEVEL = 100, Q_PER_LEVEL = 5;
const EMBEDDED_BANK = {};       // <== permanent question bank goes here: { "6": { "bangla": [ {q,o:[4],a:0-3,level?,diff?} ] } }  (or send the CSV to Claude to embed)
let CUSTOM_BANK = {};
function setCustomBank(b){ CUSTOM_BANK = b || {}; }
function customPool(cls, subject){ const l = (CUSTOM_BANK[cls] || {})[subject]; return Array.isArray(l) && l.length ? l : null; }
function samplePool(subject, cls){ return BANK[subject][bandOf(cls)].map(([q,o,a]) => ({ q, o, a })); }
function poolInfo(cls, subject){
  const c = customPool(cls, subject); if(c) return { src:'custom', n:c.length };
  if(subject === 'math') return { src:'generated', n:null };
  return { src:'sample', n:BANK[subject][bandOf(cls)].length };
}

/* Math: generated, answer computed. `level` (1–100) scales the numbers up, so higher levels are harder. */
function mathQuestion(cls, rnd, level){
  const k = 1 + ((level || 1) - 1) / 20;                                       // level 100 -> numbers ~6x bigger
  const R = (a,b) => a + Math.floor(rnd() * (Math.floor(b * k) - a + 1));      // scaled range
  const U = (a,b) => a + Math.floor(rnd() * (b - a + 1));                      // unscaled (exponents/logs: avoid overflow)
  const G = {
    6:[()=>{const a=R(120,899),b=R(100,500);return [a+' + '+b+' = ?',a+b];},
       ()=>{const a=R(12,99),b=U(3,9);return [a+' × '+b+' = ?',a*b];},
       ()=>{const b=R(100,400),a=b+R(50,400);return [a+' − '+b+' = ?',a-b];},
       ()=>{const a=U(2,9),b=U(2,9);let m=a;while(m%b!==0||m%a!==0)m++;return [a+' ও '+b+' এর ল.সা.গু. কত?',m];},
       ()=>{const n=R(10,60)*2;return [n+' এর অর্ধেক কত?',n/2];}],
    7:[()=>{const a=R(5,50),b=a+R(5,60);return ['x + '+a+' = '+b+' হলে x = ?',b-a];},
       ()=>{const p=[10,20,25,50][U(0,3)],n=R(1,10)*100;return [n+' এর '+p+'% কত?',p*n/100];},
       ()=>{const l=R(5,30),w=U(3,l);return ['দৈর্ঘ্য '+l+' সে.মি. ও প্রস্থ '+w+' সে.মি. হলে আয়তক্ষেত্রের পরিসীমা কত সে.মি.?',2*(l+w)];},
       ()=>{const a=R(3,20),b=a+R(1,20);return ['(−'+a+') + '+b+' = ?',b-a];}],
    8:[()=>{const kk=R(4,30);return ['√'+(kk*kk)+' = ?',kk];},
       ()=>{const a=U(2,9),x=R(1,12),b=R(1,20);return [a+'x + '+b+' = '+(a*x+b)+' হলে x = ?',x];},
       ()=>{const b=2*R(3,15),h=R(4,20);return ['ভূমি '+b+' সে.মি., উচ্চতা '+h+' সে.মি. হলে ত্রিভুজের ক্ষেত্রফল কত বর্গ সে.মি.?',b*h/2];},
       ()=>{const r=U(2,9);return [r+'³ = ?',r*r*r];}],
    9:[()=>{const a=R(3,12),b=U(1,Math.floor(a*a/2));return ['x + y = '+a+', xy = '+b+' হলে x² + y² = ?',a*a-2*b];},
       ()=>{const n=U(3,10);return ['2^'+n+' = ?',Math.pow(2,n)];},
       ()=>{const p=U(1,9),q=U(p+1,15)+Math.floor((level||1)/10);return ['x² − '+(p+q)+'x + '+(p*q)+' = 0 সমীকরণের বড় মূল কত?',q];},
       ()=>{const n=U(2,6),b=[2,3,5][U(0,2)];return ['log_'+b+'('+Math.pow(b,n)+') = ?',n];}],
    10:[()=>{const a=R(1,10),d=U(2,6),n=R(5,15);return ['একটি সমান্তর ধারার প্রথম পদ '+a+', সাধারণ অন্তর '+d+' হলে '+n+'তম পদ কত?',a+(n-1)*d];},
        ()=>{const kk=R(1,6);return ['সমকোণী ত্রিভুজের দুই বাহু '+(3*kk)+' ও '+(4*kk)+' হলে অতিভুজ কত?',5*kk];},
        ()=>{const n=R(5,30);return ['1 + 2 + 3 + … + '+n+' = ?',n*(n+1)/2];},
        ()=>{const p=R(1,9),q=R(1,9);return ['x² − '+(p+q)+'x + '+(p*q)+' = 0 সমীকরণের মূলদ্বয়ের গুণফল কত?',p*q];}]
  };
  const list = G[isValidClass(cls) ? cls : 6];
  const [text, ans] = list[Math.floor(rnd() * list.length)]();
  const set = new Set([ans]); let guard = 0;
  while(set.size < 4 && guard++ < 200){
    const d = (1 + Math.floor(rnd() * 10)) * (rnd() < .5 ? -1 : 1), v = ans + d;
    if(ans < 0 || v >= 0) set.add(v);
  }
  let n2 = 1; while(set.size < 4) set.add(ans + 10 + n2++);
  const opts = shuffled([...set], rnd).map(String);
  return { q:text, o:opts, a:opts.indexOf(String(ans)) };
}
function shuffled(arr, rnd){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Level -> questions. Bank order is assumed EASY -> HARD:
   1) questions tagged level=L are used first;  2) the rest are sliced by position, so level 1 = first questions, level 100 = last. */
function pickForLevel(list, level, count, rnd){
  const tagged = list.filter(x => x.level === level), rest = list.filter(x => !x.level);
  let out = tagged.length ? shuffled(tagged, rnd).slice(0, count) : [];
  if(out.length < count){
    const need = count - out.length, n = rest.length; let slice;
    if(n <= need) slice = rest; else { const start = Math.round((level - 1) * (n - need) / (MAX_LEVEL - 1)); slice = rest.slice(start, start + need); }
    out = out.concat(slice);
  }
  if(out.length < count){ const have = new Set(out); out = out.concat(shuffled(list.filter(x => !have.has(x)), rnd).slice(0, count - out.length)); }
  return out;
}
function itemsToQuiz(items, rnd){
  return items.map(it => { const order = shuffled(it.o.map((txt, i) => ({ txt, i })), rnd); return { q:it.q, o:order.map(x => x.txt), a:order.findIndex(x => x.i === it.a), src:it.src }; });
}
function buildQuiz(subject, cls, count, rnd, level){
  rnd = rnd || Math.random; count = count || Q_PER_LEVEL; cls = isValidClass(cls) ? cls : 6;
  if(!SUBJECT_KEYS.includes(subject)) throw new Error('BAD_SUBJECT');
  const cp = customPool(cls, subject);
  if(cp) return itemsToQuiz(level ? pickForLevel(cp, level, count, rnd) : shuffled(cp, rnd).slice(0, count), rnd);
  if(subject === 'math'){
    const out = [], seen = new Set(); let guard = 0;
    while(out.length < count && guard++ < 100){ const q = mathQuestion(cls, rnd, level); if(!seen.has(q.q)){ seen.add(q.q); out.push(q); } }
    return out;
  }
  const sp = samplePool(subject, cls);
  return itemsToQuiz(level ? pickForLevel(sp, level, count, rnd) : shuffled(sp, rnd).slice(0, count), rnd);
}
/* Level progress. bests = { "1": 5, "2": 3, ... } (best score per played level). */
function computeProgress(bests, min){
  bests = bests || {}; min = min || 0; let done = 0;
  while(done < MAX_LEVEL && bests[done + 1] !== undefined && bests[done + 1] >= min) done++;
  return { done, unlocked:Math.min(MAX_LEVEL, done + 1) };
}

/* ---------- QUESTION-BANK IMPORT (CSV / JSON) ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function normAnswer(v){ const s = String(v == null ? '' : v).trim().toUpperCase(); if(/^[A-D]$/.test(s)) return s.charCodeAt(0) - 65; if(/^[1-4]$/.test(s)) return +s - 1; return -1; }
function parseBankText(text){
  const errors = [], bank = {}; let items = [], count = 0;
  text = String(text || '').replace(/^﻿/, '').trim();
  if(!text) return { bank, count, errors:[{ row:0, msg:'empty input' }] };
  if(text[0] === '[' || text[0] === '{'){
    let j; try{ j = JSON.parse(text); }catch(e){ return { bank, count, errors:[{ row:0, msg:'JSON: ' + e.message }] }; }
    items = (Array.isArray(j) ? j : [j]).map((o, i) => ({ row:i + 1, cls:+o.class, subject:o.subject, level:o.level, q:o.question || o.q, o:o.options || [o.optionA, o.optionB, o.optionC, o.optionD], ans:o.answer, diff:o.difficulty }));
  } else {
    const rows = parseCSV(text), head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    const need = ['class','subject','question','optiona','optionb','optionc','optiond','answer'], miss = need.filter(h => head.indexOf(h) < 0);
    if(miss.length) return { bank, count, errors:[{ row:1, msg:'missing column(s): ' + miss.join(', ') }] };
    const ix = n => head.indexOf(n);
    rows.forEach((r, i) => { if(r.every(c => !String(c).trim())) return;
      items.push({ row:i + 2, cls:+r[ix('class')], subject:(r[ix('subject')] || '').trim(), level:ix('level') >= 0 ? r[ix('level')] : '', q:r[ix('question')], o:[r[ix('optiona')], r[ix('optionb')], r[ix('optionc')], r[ix('optiond')]], ans:r[ix('answer')], diff:ix('difficulty') >= 0 ? r[ix('difficulty')] : '' }); });
  }
  const seen = new Set();
  for(const it of items){
    const bad = m => errors.push({ row:it.row, msg:m });
    if(!isValidClass(it.cls)) { bad('class must be 6–10'); continue; }
    if(!SUBJECT_KEYS.includes(it.subject)) { bad('unknown subject "' + it.subject + '"'); continue; }
    const q = String(it.q == null ? '' : it.q).trim(); if(!q || q.length > 300) { bad('question empty or >300 chars'); continue; }
    const o = (it.o || []).map(x => String(x == null ? '' : x).trim());
    if(o.length !== 4 || o.some(x => !x || x.length > 120)) { bad('need 4 non-empty options (≤120 chars)'); continue; }
    if(new Set(o).size !== 4) { bad('duplicate options'); continue; }
    const a = normAnswer(it.ans); if(a < 0) { bad('answer must be A–D (or 1–4)'); continue; }
    let level = 0; if(it.level !== undefined && it.level !== null && String(it.level).trim() !== ''){ level = Number(it.level); if(!Number.isInteger(level) || level < 1 || level > MAX_LEVEL) { bad('level must be 1–100'); continue; } }
    const key = it.cls + '|' + it.subject + '|' + q; if(seen.has(key)) { bad('duplicate question in this import'); continue; } seen.add(key);
    const entry = { q, o, a }; if(level) entry.level = level; if(it.diff) entry.diff = String(it.diff).trim().slice(0, 10);
    ((bank[it.cls] = bank[it.cls] || {})[it.subject] = (bank[it.cls] || {})[it.subject] || []).push(entry); count++;
  }
  return { bank, count, errors };
}
function mergeBanks(a, b){
  const out = JSON.parse(JSON.stringify(a || {}));
  for(const c in (b || {})) for(const s in b[c]){
    out[c] = out[c] || {}; const cur = out[c][s] = out[c][s] || []; const have = new Set(cur.map(x => x.q));
    for(const it of b[c][s]) if(!have.has(it.q)){ cur.push(it); have.add(it.q); }
  }
  return out;
}
function bankCounts(bank){ const m = {}; for(const c of CLASSES){ m[c] = {}; for(const s of SUBJECT_KEYS) m[c][s] = ((bank[c] || {})[s] || []).length; } return m; }

function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object') deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

/* ---------- AUDIO (synthesised — no external assets, so no licence risk) ---------- */
const Snd = {
  ctx:null,
  unlock(){ try{ if(!this.ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx = new AC(); } if(this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  defs:{
    click:{cat:'ui',notes:[[880,0,.05]],type:'sine',vol:.5},
    nav:{cat:'ui',notes:[[660,0,.06],[880,.05,.06]],type:'sine',vol:.45},
    correct:{cat:'learn',notes:[[523,0,.12],[659,.1,.12],[784,.2,.2]],type:'triangle',vol:.6},
    wrong:{cat:'learn',notes:[[220,0,.18],[196,.12,.22]],type:'sine',vol:.5},
    levelup:{cat:'levelup',notes:[[523,0,.14],[659,.12,.14],[784,.24,.14],[1047,.36,.3]],type:'triangle',vol:.65},
    achieve:{cat:'achieve',notes:[[784,0,.12],[988,.1,.12],[1175,.2,.3]],type:'triangle',vol:.6},
    notify:{cat:'multi',notes:[[740,0,.1],[988,.12,.16]],type:'sine',vol:.5}
  },
  play(name, force){
    const a = P.audio, d = this.defs[name]; if(!d) return;
    if(!force && (a.muted || !a.cats[d.cat])) return;
    if(force && a.muted) return;
    this.unlock(); if(!this.ctx) return;
    try{
      const now = this.ctx.currentTime, cap = .12 * a.master * d.vol;           // hard-capped: never loud
      d.notes.forEach(([f,st,du])=>{
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = d.type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now+st);
        g.gain.exponentialRampToValueAtTime(Math.max(cap,0.0002), now+st+.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now+st+du);
        o.connect(g).connect(this.ctx.destination); o.start(now+st); o.stop(now+st+du+.02);
      });
    }catch(e){ /* audio unavailable -> silent fallback */ }
  }
};
document.addEventListener('pointerdown', ()=>Snd.unlock(), {once:true});
document.addEventListener('click', e=>{ const b = e.target.closest('button,.chip,.opt,.sw'); if(b && !b.disabled && b.getAttribute('aria-disabled')!=='true' && !b.dataset.nosound) Snd.play('click'); });

/* Atomic, idempotent Player-ID allocation (Firestore transaction on meta/playerIdSequence).
   Uniqueness is ALSO enforced by playerIds/{id} being create-only (see firestore.rules).
   NOTE: allocation runs from the client under strict rules; a Cloud Function is the stronger option (see PROGRESS.md). */
async function ensureAccount(u){
  const uref = fbDb.collection('users').doc(u.uid), pref = fbDb.collection('profiles').doc(u.uid), seq = fbDb.collection('meta').doc('playerIdSequence');
  const now = firebase.firestore.FieldValue.serverTimestamp();
  await fbDb.runTransaction(async tx=>{
    const us = await tx.get(uref);
    if(us.exists) return;                                   // idempotent: retries never allocate a second ID
    const ss = await tx.get(seq);
    const no = ss.exists ? ss.data().next : 1;
    const pid = formatPlayerId(no);                         // throws PLAYER_ID_RANGE on overflow
    tx.set(seq, {next:no+1});
    tx.set(fbDb.collection('playerIds').doc(pid), {uid:u.uid});
    tx.set(uref, {playerNo:no, playerId:pid, email:u.email||'', onboarded:false, class:null, lang:P.lang, prefs:P, createdAt:now});
    tx.set(pref, {playerId:pid, displayName:validateDisplayName((u.displayName||'').slice(0,20))||('Player'+pid.slice(-4)), avatar:'crystal:cyan', class:null, bio:'', xp:0, level:1, streak:0, streakLevels:0, ach:[], showProgress:true, allowRequests:true, createdAt:now});
  });
  const [us, ps] = await Promise.all([uref.get(), pref.get()]);
  S.priv = us.data(); S.pub = ps.data();
}

const ROUTES = ['/lobby','/academy','/ranked','/multiplayer','/friends','/leaderboard','/achievements','/missions','/inventory','/profile','/settings','/auth','/onboarding','/quiz','/result','/admin'];
const PHASE = {}; // All phases implemented
/* Router keeps its own in-memory path, so it still works when the page is shown inside a sandboxed
   preview/iframe where location.hash / history.replaceState can throw or never fire. */
let memPath = '/', navStack = [];
function hashPath(){ try{ return location.hash.replace(/^#/,'') || ''; }catch(e){ return ''; } }
function writeHash(path, replace){
  try{ if(replace) history.replaceState(null,'','#'+path); else location.hash = path; }catch(e){ /* sandboxed: ignore */ }
}

function goBack(){ const p = navStack.pop(); if(p && p!==memPath){ memPath=p; writeHash(p,true); route(); } else go('/lobby'); }
function guard(path){
  if(!S.uid) return '/auth';
  if(!S.priv || !S.priv.onboarded) return '/onboarding';
  if(path==='/auth'||path==='/onboarding'||path===''||path==='/') return '/lobby';
  return path;
}
function route(){
  if(!booted) return;
  try{
    const raw = memPath || '/';
    const known = ROUTES.includes(raw) || raw==='/' || isAcademySub(raw) || isPlayerRoute(raw);
    const target = guard(raw);
    const path = (!known && S.uid && S.priv && S.priv.onboarded) ? '/404' : target;
    if(path !== raw && path !== '/404'){ memPath = path; writeHash(path,true); }
    const cfg = S.cfg || {}, bn = P.lang==='bn';
    if(!S.isAdmin && path !== '/auth'){
      if(cfg.maintenance && cfg.maintenance.on){
        return viewBlocked(bn?'রক্ষণাবেক্ষণ চলছে':'Under maintenance', cfg.maintenance.msg || (bn?'কিছুক্ষণ পরে আবার আসুন।':'Please come back soon.'),
          S.uid ? '' : `<button class="btn ghost full" id="bl-admin">Admin login</button>`);
      }
      if(cfg.minVersion && verCmp(cfg.minVersion, APP_VERSION) > 0) return viewBlocked(bn?'আপডেট দরকার':'Update required', cfg.updateMsg || (bn?'অ্যাপটি রিফ্রেশ করে নতুন সংস্করণ নিন।':'Reload the app to get the new version.'));
      const gate = {'/multiplayer':'multiplayer','/ranked':'ranked','/friends':'friends','/leaderboard':'leaderboard'}[path];
      if(gate && cfg.features && cfg.features[gate] === false){ toast(bn?'এই ফিচার সাময়িকভাবে বন্ধ আছে':'This feature is temporarily turned off','error'); return go('/lobby'); }
    }
    render(path);
  }catch(e){ console.error(e); showFatal(e); }
}

function resizeImage(file, size){
  return new Promise((res,rej)=>{
    const fr = new FileReader(); fr.onerror = ()=>rej(new Error('read'));
    fr.onload = ()=>{ const img = new Image(); img.onerror = ()=>rej(new Error('image'));
      img.onload = ()=>{ const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); const m = Math.min(img.width,img.height);
        x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size); res(c.toDataURL('image/jpeg',0.8)); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- 60% LESSON-UNLOCK RULE (each Academy level = one lesson; 10 lessons per unit) ---------- */
function levelStatuses(cls, subject){
  if(!window.LevelUpCore) return null;
  const bests = progressOf(cls, subject), units = [], lessons = [], prog = {};
  for(let u = 1; u <= MAX_LEVEL / 10; u++) units.push({ id:'u'+u, order:u, status:'published' });
  const cfg = { version:1, activities:[{ id:'quiz', type:'quiz', weight:100, required:true, xp:0,
    minScorePercent: UNLOCK_MIN_CORRECT > 0 ? UNLOCK_MIN_CORRECT * 100 / Q_PER_LEVEL : null }] };
  for(let L = 1; L <= MAX_LEVEL; L++){
    lessons.push({ id:'L'+L, unitId:'u'+Math.ceil(L/10), order:L, status:'published', config:cfg });
    if(bests[L] !== undefined) prog['L'+L] = { activities:{ quiz:{ done:true, scorePercent: bests[L] * 100 / Q_PER_LEVEL } } };
  }
  return LevelUpCore.computeAccess({ units, lessons }, prog, []);
}
function lessonCard(st, cls, subject){
  let curL = MAX_LEVEL; for(let L = 1; L <= MAX_LEVEL; L++){ if(st['L'+L].unlocked && !st['L'+L].met){ curL = L; break; } }
  const c = st['L'+curL], nextLocked = curL < MAX_LEVEL && !st['L'+(curL+1)].unlocked;
  const msg = c.met ? t('lessonMetMsg') : t('lessonOpenMsg');
  return `<div class="card glow" style="margin:12px 0">

    <div class="bar" style="margin:10px 0 6px" role="progressbar" aria-label="${esc(t('lessonProg'))}" aria-valuenow="${c.percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${c.percent}%"></i></div>

    ${nextLocked ? `<p class="faint" style="margin:0 0 8px">${icon('lock',12)} ${esc(t('lessonLockedMsg'))}</p>` : ''}
    <button class="btn full" id="lc-go" style="margin-top:6px">${esc(t('nextActWord'))}: ${esc(t('startWord'))} →</button>

}
function viewLevels(subject){
  const cls = myClass(), bests = progressOf(cls, subject), pr = computeProgress(bests, UNLOCK_MIN_CORRECT);
  let nodes = ''; const lvS = levelStatuses(cls, subject);
  for(let L = 1; L <= MAX_LEVEL; L++){
    if(L % 10 === 1) nodes += `<div class="faint" style="grid-column:1/-1;margin-top:${L===1?0:8}px"><b>${esc(t('unitWord'))} ${Math.ceil(L/10)}</b></div>`;
    const ls = lvS ? lvS['L'+L] : null;
    const st = ls ? (ls.met ? 'done' : (ls.unlocked ? 'cur' : 'lock')) : (L <= pr.done ? 'done' : (L === pr.unlocked ? 'cur' : 'lock'));
    const sub = bests[L] !== undefined ? bests[L] + '/' + Q_PER_LEVEL : (st === 'lock' ? icon('lock',12) : '');
    nodes += `<button class="lv ${st}" data-lv="${L}" aria-label="${esc(t('levelWord'))} ${L}${st==='lock'?' ('+esc(t('lvLocked'))+')':''}" ${st==='lock'?'aria-disabled="true"':''}>${L}<small>${sub}</small></button>`;
  }

async function finishQuiz(){
  const Q = QZ; if(!Q) return;
  const sc = Q.score; Q.res = {}; Q.xpEarned = 0;
  const nb = $('#qn'); if(nb) nb.disabled = true;
  if(Q.mode === 'level'){
    const prog = JSON.parse(JSON.stringify(S.priv.progress || {})), c = String(Q.cls);
    prog[c] = prog[c] || {}; const cur = prog[c][Q.subject] = prog[c][Q.subject] || {};
    const isFirst = cur[Q.level] === undefined;
    cur[Q.level] = isFirst ? sc : Math.max(cur[Q.level], sc);
    const pr = computeProgress(cur, UNLOCK_MIN_CORRECT);
    Q.res = { passed: sc >= UNLOCK_MIN_CORRECT, hasNext: Q.level < MAX_LEVEL && pr.unlocked > Q.level };
    saveAccount({progress:prog}).catch(()=>{});
    if(isFirst && sc > 0){
      Q.xpEarned = await awardXp(Q.subject, Q.cls, Q.level, sc);
      if(Q.xpEarned > 0){ Snd.play('levelup'); toast(tf('xpEarned',{n:Q.xpEarned}),'ok'); }
    }
    incrementMission('levels', 1);
  } else if(Q.mode === 'ranked'){
    const qs = Object.assign({}, S.priv.quizStats || {}); const cur = qs[Q.subject] || {played:0,best:0};
    qs[Q.subject] = {played:cur.played+1, best:Math.max(cur.best,sc), last:sc};
    saveAccount({quizStats:qs}).catch(()=>{});
    if(sc > 0){
      Q.xpEarned = await awardRankedXp(Q.subject, sc);
      if(Q.xpEarned > 0) toast(tf('xpEarned',{n:Q.xpEarned}),'ok');
      else toast(BE('আজকের র‍্যাংকড XP সীমা শেষ (প্রতি বিষয়ে ৩ বার)','Daily ranked XP limit reached (3 per subject)'));
    }
  } else if(Q.mode === 'multi'){
    await mpReport(Q, true);
  } else {
    const qs = Object.assign({}, S.priv.quizStats || {}); const cur = qs[Q.subject] || {played:0,best:0};
    qs[Q.subject] = {played:cur.played+1, best:Math.max(cur.best,sc), last:sc};
    saveAccount({quizStats:qs}).catch(()=>{});
  }
  incrementMission('quizzes', 1);
  incrementMission('correct', sc);
  incrementDistinctSubject(Q.subject);
  updateStreak();
  logAttempt(Q, sc);
  checkAchievements();
  if(QZ === Q) go('/result');
}

/* ---------- XP GRANT: ONE transaction = new create-only ledger doc + profile increment ----------
   firestore.rules accepts a profile XP increase ONLY when it equals a brand-new xpLedger doc with an allowed key
   pattern and cap, so XP can no longer be written directly from the console/client. (Quiz correctness is still
   client-reported; fully cheat-proof grading needs a server function.) Returns: >0 granted, 0 already granted, -1 error. */
async function grantXp(ledgerKey, amount, meta){
  amount = Math.floor(Number(amount) || 0);
  if(amount <= 0 || amount > 200) return -1;
  if(S.mode === 'preview'){ S.pub.xp = (S.pub.xp||0) + amount; persistPreview(); return amount; }
  if(S.mode !== 'fb' || !S.uid) return -1;
  const key = S.uid + '_' + ledgerKey;
  const lref = fbDb.collection('xpLedger').doc(key), pref = fbDb.collection('profiles').doc(S.uid);
  try{
    const granted = await fbDb.runTransaction(async tx=>{
      if((await tx.get(lref)).exists) return false;
      tx.set(lref, Object.assign({}, meta || {}, { uid:S.uid, earned:amount, createdAt:firebase.firestore.FieldValue.serverTimestamp() }));
      tx.update(pref, { xp:firebase.firestore.FieldValue.increment(amount), lastXpKey:key });
      return true;
    });
    if(granted){ S.pub.xp = (S.pub.xp||0) + amount; S.pub.lastXpKey = key; return amount; }
    return 0;
  }catch(e){ console.warn('xp grant failed', e); return -1; }
}
/* Academy level: XP only the first time a level is cleared */
async function awardXp(subject, cls, level, score){
  const r = await grantXp(`${cls}_${subject}_${level}`, score * 10, { subject, cls, level, score });
  if(r > 0) checkAchievements();
  return r > 0 ? r : 0;
}
/* Ranked quiz: XP for at most 3 attempts per subject per day */
async function awardRankedXp(subject, score){
  for(let n = 1; n <= 3; n++){
    const r = await grantXp(`ranked_${todayKey()}_${subject}_${n}`, score * 10, { subject, score, kind:'ranked' });
    if(r > 0){ checkAchievements(); return r; }
    if(r < 0) return 0;
  }
  return 0;
}

/* -- Streak -- */
function updateStreak(){
  const today = new Date().toDateString();
  const last = (S.priv && S.priv.lastPlayDate) || '';
  const yesterday = new Date(Date.now()-86400000).toDateString();
  let streak = (S.priv && S.priv.streak) || 0;
  if(last === today){ /* same day, no change */ }
  else if(last === yesterday){ streak++; }
  else { streak = 1; }
  let bonus = (S.priv && S.priv.streakLevels) || 0;
  if(last !== today && streak > 1 && streak % 3 === 0){ bonus++; toast(P.lang==='bn'?'🔥 টানা '+streak+' দিন! +১ লেভেল':'🔥 '+streak+'-day streak! +1 level','ok'); }
  saveAccount({ streak, lastPlayDate:today, streakLevels:bonus, lastActiveAt:Date.now() }, { streak, streakLevels:bonus }).catch(()=>{});
}

  if(!S.priv) return;
  const all = Object.assign({}, S.priv.missions || {}); all[key] = p;
  const cut = new Date(Date.now() - MISSION_KEEP_DAYS * 86400000).toISOString().slice(0,10);
  Object.keys(all).forEach(k => { if(k.replace(/^w/, '') < cut) delete all[k]; });
  S.priv.missions = all; queueMissionSave();
}

async function claimMission(key, mission){
  const p = Object.assign({}, getMissionProgress(key));
  if(p['claimed_'+mission.id]) return;
  if(!(p[mission.id] >= mission.target)) return;                       // must be completed first
  const r = await grantXp(`mission_${key}_${mission.id}`, mission.xp, { kind:'mission', mission:mission.id });
  if(r < 0){ toast(BE('XP যোগ করা যায়নি, আবার চেষ্টা করুন','Could not add XP, try again'), 'error'); return; }
  p['claimed_'+mission.id] = 1; setMissionProgress(key, p);
  if(r > 0){ Snd.play('achieve'); toast(tf('xpReward',{n:mission.xp}), 'ok'); checkAchievements(); }
}
function missionProgress(key, id){ return getMissionProgress(key)[id] || 0; }
function incrementMission(stat, n=1){
  const dk = todayKey(), wk = weekKey();
  for(const key of [dk, wk]){
    const p = Object.assign({}, getMissionProgress(key)), list = key===dk ? DAILY_MISSIONS : WEEKLY_MISSIONS;
    let ch = false;
    list.filter(m => m.stat === stat).forEach(m => { if(!p['claimed_'+m.id]){ p[m.id] = (p[m.id]||0) + n; ch = true; } });
    if(ch) setMissionProgress(key, p);
  }
}
/* "different subjects" missions count each subject once per period */
function incrementDistinctSubject(subject){
  const dk = todayKey(), wk = weekKey();
  for(const key of [dk, wk]){
    const p = Object.assign({}, getMissionProgress(key)), seen = Array.isArray(p.subjSeen) ? p.subjSeen.slice() : [];
    if(seen.includes(subject)) continue;
    seen.push(subject); p.subjSeen = seen;
    (key===dk ? DAILY_MISSIONS : WEEKLY_MISSIONS).filter(m => m.stat === 'subjects').forEach(m => { if(!p['claimed_'+m.id]) p[m.id] = (p[m.id]||0) + 1; });
    setMissionProgress(key, p);
  }
}

      <span class="grow" style="margin:0 8px;display:flex;align-items:center;gap:8px">${rankBadge(rankIndex(r.xp||0),26)}<span>${esc(r.displayName||'Player')}</span></span>
      <span class="pill" style="background:${rankColor(r.xp||0)}20;color:${rankColor(r.xp||0)}">${(r.xp||0)} XP</span>

/* ====================================================================
   PHASE 6 — FRIENDS  (Firestore: friendships/{uidA_uidB}, status pending|accepted)
   + VISIT ANOTHER PLAYER'S PROFILE  (#/player/<uid>)
   ==================================================================== */
const fsId = (a,b) => [a,b].sort().join('_');
const isPlayerRoute = p => /^\/player\/[A-Za-z0-9]{6,40}$/.test(p);
let FR = { friends:[], incoming:[], outgoing:[] };

async function loadFriendships(){
  FR = { friends:[], incoming:[], outgoing:[] };
  if(S.mode !== 'fb') return FR;
  const snap = await fbDb.collection('friendships').where('users','array-contains',S.uid).limit(200).get();
  snap.forEach(d=>{
    const x = d.data(), mine = x.from === S.uid;
    const row = { id:d.id, uid: mine ? x.to : x.from, name: mine ? x.toName : x.fromName, pid: mine ? x.toPid : x.fromPid, status:x.status };
    if(x.status === 'accepted') FR.friends.push(row); else if(mine) FR.outgoing.push(row); else FR.incoming.push(row);
  });
  return FR;
}
async function searchPlayer(pid){
  if(S.mode !== 'fb') return null;
  pid = String(pid).trim();
  const snap = await fbDb.collection('playerIds').doc(pid).get();
  if(!snap.exists) return null;
  const { uid } = snap.data();
  const prof = await fbDb.collection('profiles').doc(uid).get();
  return prof.exists ? { ...prof.data(), uid, playerId:pid } : null;
}
/* target = { uid, playerId, displayName, allowRequests } */
async function sendFriendRequest(target){
  if(S.mode !== 'fb'){ toast(BE('অনলাইনে লগইন করুন','Login online first'),'error'); return; }
  if(target.uid === S.uid){ toast(t('cantAddSelf'),'error'); return; }
  if(target.allowRequests === false){ toast(BE('এই প্লেয়ার এখন বন্ধুর অনুরোধ নিচ্ছে না','This player is not accepting friend requests'),'error'); return; }
  const ref = fbDb.collection('friendships').doc(fsId(S.uid, target.uid));
  try{
    const cur = await ref.get();
    if(cur.exists){
      const x = cur.data();
      if(x.status === 'accepted'){ toast(t('alreadyFriend')); return; }
      if(x.from === S.uid){ toast(t('reqSent')); return; }
      await ref.update({ status:'accepted', acceptedAt:firebase.firestore.FieldValue.serverTimestamp() });   // they already asked me
      toast(BE('বন্ধু যোগ হয়েছে!','Friend added!'),'ok'); return;
    }
    await ref.set({ users:[S.uid, target.uid], from:S.uid, to:target.uid,
      fromName:(S.pub && S.pub.displayName) || 'Player', toName:target.displayName || 'Player',
      fromPid:(S.pub && S.pub.playerId) || '', toPid:target.playerId || '', status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    toast(t('reqSent'),'ok');
  }catch(e){ toast(errMsg(e),'error'); }
}
async function acceptFriend(id){
  await fbDb.collection('friendships').doc(id).update({ status:'accepted', acceptedAt:firebase.firestore.FieldValue.serverTimestamp() });
}
async function deleteFriendship(id){ await fbDb.collection('friendships').doc(id).delete(); }

function viewFriends(){
  setView(`<header class="row between"><button class="btn sm ghost" onclick="goBack()">←</button><h1>${esc(t('friendsHead'))}</h1><button class="btn sm" id="add-fr">${esc(t('addFriend'))}</button></header>
  <div id="fr-body"><div class="card empty"><p>${esc(t('loading'))}</p></div></div>`);

function renderFriends(){

  b.innerHTML =
    (FR.incoming.length ? `<h3 style="margin:12px 0 8px">${esc(t('friendReqs'))}</h3>` + FR.incoming.map(r => row(r, `<button class="btn sm ok" data-acc="${esc(r.id)}">${esc(t('accept'))}</button><button class="btn sm ghost" data-del="${esc(r.id)}">${esc(t('decline'))}</button>`)).join('') : '')
    + `<h3 style="margin:12px 0 8px">${esc(t('friendsHead'))} (${FR.friends.length})</h3>`
    + (FR.friends.length ? FR.friends.map(r => row(r, `<button class="btn sm ghost" data-del="${esc(r.id)}" data-rm="1">${esc(t('removeFriend'))}</button>`)).join('') : `<div class="card empty">${icon('friends',36)}<p>${esc(t('noFriends'))}</p></div>`)
    + (FR.outgoing.length ? `<h3 style="margin:12px 0 8px">${esc(BE('পাঠানো অনুরোধ','Sent requests'))}</h3>` + FR.outgoing.map(r => row(r, `<button class="btn sm ghost" data-del="${esc(r.id)}">${esc(t('cancel'))}</button>`)).join('') : '');
  const reload = () => loadFriendships().then(renderFriends).catch(e=>toast(errMsg(e),'error'));
  b.querySelectorAll('[data-pv]').forEach(x => x.onclick = () => go('/player/' + x.dataset.pv));
  b.querySelectorAll('[data-acc]').forEach(x => x.onclick = async () => { x.disabled = true; try{ await acceptFriend(x.dataset.acc); toast(BE('বন্ধু যোগ হয়েছে!','Friend added!'),'ok'); }catch(e){ toast(errMsg(e),'error'); } reload(); });
  b.querySelectorAll('[data-del]').forEach(x => x.onclick = async () => {
    if(x.dataset.rm && !confirm(BE('বন্ধু তালিকা থেকে সরাবেন?','Remove this friend?'))) return;
    x.disabled = true; try{ await deleteFriendship(x.dataset.del); }catch(e){ toast(errMsg(e),'error'); } reload();
  });
}

/* ====================================================================
   PHASE 7 — MULTIPLAYER (room-based via Firestore, client-trusted)
   ==================================================================== */
let currentRoom = null;
let roomUnsub = null;

function makeRoomCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
const mpStandings = d => Object.entries((d && d.players) || {}).map(([uid,p]) => Object.assign({ uid }, p)).sort((a,b) => (b.score||0) - (a.score||0));

async function createMultiRoom(subject){
  if(S.mode!=='fb'){ toast(P.lang==='bn'?'অনলাইনে লগইন করুন':'Login to play online','error'); return; }
  try{
    if(currentRoom) await leaveRoom();
    let code, ref;
    for(let i = 0; i < 5; i++){ code = makeRoomCode(); ref = fbDb.collection('rooms').doc(code); if(!(await ref.get()).exists) break; }
    await ref.set({
      code, subject, cls:myClass(), host:S.uid, status:'waiting',
      players:{[S.uid]:{name:S.pub.displayName, score:0, answered:0, done:false}},
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    currentRoom = { code, ref, subject, isHost:true, started:false, data:null };
    listenRoom(code);
    viewMultiRoom(code);
  }catch(e){ toast(errMsg(e),'error'); }
}
async function joinMultiRoom(code){
  if(S.mode!=='fb'){ toast(P.lang==='bn'?'অনলাইনে লগইন করুন':'Login to play online','error'); return; }
  code = String(code||'').toUpperCase().trim();
  try{
    if(currentRoom) await leaveRoom();
    const ref = fbDb.collection('rooms').doc(code);
    const snap = await ref.get();
    if(!snap.exists){ toast(P.lang==='bn'?'রুম পাওয়া যায়নি':'Room not found','error'); return; }
    const d = snap.data(), players = d.players || {};
    if(!players[S.uid]){
      if(d.status !== 'waiting'){ toast(BE('খেলা আগেই শুরু হয়ে গেছে','The game has already started'),'error'); return; }
      if(Object.keys(players).length >= 4){ toast(P.lang==='bn'?'রুম পূর্ণ':'Room is full','error'); return; }
      await ref.update({[`players.${S.uid}`]:{name:S.pub.displayName, score:0, answered:0, done:false}});
    }
    currentRoom = { code, ref, subject:d.subject, isHost:d.host===S.uid, started:false, data:null };
    listenRoom(code);
    viewMultiRoom(code);
  }catch(e){ toast(errMsg(e),'error'); }
}
function listenRoom(code){
  if(roomUnsub) roomUnsub();
  const room = currentRoom;
  roomUnsub = fbDb.collection('rooms').doc(code).onSnapshot(snap=>{
    if(!currentRoom || currentRoom !== room) return;
    if(!snap.exists){
      currentRoom = null; if(roomUnsub){ roomUnsub(); roomUnsub = null; } QZ = null;
      toast(P.lang==='bn'?'রুম শেষ':'Room ended'); go('/multiplayer'); return;
    }
    const d = snap.data(); room.data = d;
    if(d.status === 'playing' && !room.started){ room.started = true; startMultiGame(d); }        // start exactly once
    else if(room.started){ updateMultiLive(d); }
    else if(document.querySelector('#multi-room-view')){ renderRoomView(d); }
  }, e => toast(errMsg(e),'error'));
}
function viewMultiRoom(code){
  setView(`<div id="multi-room-view"><header class="row between"><button class="btn sm ghost" id="leave-r">← ${esc(t('leaveRoom'))}</button><span class="pill">${esc(code)}</span>${themeBtn()}</header>
  <div class="card" style="padding:16px;margin:12px 0;text-align:center"><span class="muted">${esc(t('roomCode'))}: </span><b style="font-size:22px;letter-spacing:3px">${esc(code)}</b>
  <br><button class="btn sm ghost" id="cpy-room" style="margin-top:8px">${esc(t('copyCode'))}</button></div>
  <div id="rm-players"></div>
  <div id="rm-actions" style="margin-top:16px"></div>
  <p class="muted" style="font-size:12px;margin-top:10px">${esc(t('multiNote'))}</p></div>`);
  $('#leave-r').onclick = async ()=>{ await leaveRoom(); go('/multiplayer'); };
  $('#cpy-room').onclick = ()=>{ navigator.clipboard.writeText(code).catch(()=>{}); toast(t('copied'),'ok'); };
  if(currentRoom && currentRoom.data) renderRoomView(currentRoom.data);
}
function renderRoomView(d){
  const rp = $('#rm-players'); if(!rp) return;
  const isHost = d.host === S.uid, players = Object.entries(d.players || {});
  rp.innerHTML = `<h3 style="margin:0 0 8px">${esc(t('players'))} (${players.length}/4)</h3>` + players.map(([uid,p]) => `<div class="card row between" style="padding:10px 14px;margin-bottom:6px"><span>${esc(p.name)}</span>${uid===d.host?'<span class="pill">Host</span>':''}</div>`).join('');
  const ra = $('#rm-actions'); if(!ra) return;
  if(isHost && players.length >= 2) ra.innerHTML = `<button class="btn full" id="start-multi">${esc(t('startGame'))}</button>`;
  else ra.innerHTML = `<p class="muted">${esc(t('waitPlayers'))}</p>`;
  const sb = $('#start-multi');
  if(sb) sb.onclick = async ()=>{
    sb.disabled = true;
    const cls = d.cls || myClass(), list = buildQuiz(d.subject, cls, Q_PER_LEVEL, Math.random);      // host picks ONE question set for everybody
    if(!list.length){ toast(t('noQ'),'error'); sb.disabled = false; return; }
    try{
      await currentRoom.ref.update({ status:'playing', cls, questions:list.map(x => ({ q:x.q, o:x.o, a:x.a })), startedAt:firebase.firestore.FieldValue.serverTimestamp() });
    }catch(e){ toast(errMsg(e),'error'); sb.disabled = false; }
  };
}
async function leaveRoom(){
  const r = currentRoom; if(!r) return;
  currentRoom = null;
  if(roomUnsub){ roomUnsub(); roomUnsub = null; }
  try{
    if(r.isHost && (!r.data || r.data.status === 'waiting')) await r.ref.delete();                 // host leaves a lobby -> room closes
    else await r.ref.update({[`players.${S.uid}`]:firebase.firestore.FieldValue.delete()});
  }catch(e){}
}
function startMultiGame(d){
  const list = (d.questions || []).map(x => ({ q:x.q, o:x.o, a:x.a }));
  if(!list.length) return;
  QZ = { mode:'multi', subject:d.subject, cls:d.cls || myClass(), level:0, list, i:0, score:0, picked:[], locked:false, roomCode:d.code };
  go('/quiz');
}
/* my score/progress -> room doc (other players see it live) */
function mpReport(Q, done){
  if(!currentRoom || !Q || currentRoom.code !== Q.roomCode) return Promise.resolve();
  return currentRoom.ref.update({
    [`players.${S.uid}.score`]:Q.score,
    [`players.${S.uid}.answered`]:Q.picked.filter(x => x != null).length,
    [`players.${S.uid}.done`]:!!done
  }).catch(()=>{});
}
function updateMultiLive(d){
  const live = $('#mp-live');
  if(live) live.innerHTML = mpStandings(d).map(p => `<span class="pill ${p.uid===S.uid?'gold':''}">${esc(p.name)}: ${p.score||0}</span>`).join('');
  const res = $('#mp-result'); if(res) renderMultiStandings(res, d);
}
function renderMultiStandings(box, d){
  const rows = mpStandings(d), all = rows.length > 0 && rows.every(p => p.done), top = rows.length ? (rows[0].score||0) : 0, n = QZ ? QZ.list.length : Q_PER_LEVEL;
  box.innerHTML = (all ? '' : `<p class="muted">${esc(BE('অন্যদের শেষ হওয়ার অপেক্ষা…','Waiting for the others to finish…'))}</p>`)
    + `<div class="card" style="padding:0;overflow:hidden;text-align:left">` + rows.map((p,i) => `<div class="row between" style="padding:10px 14px;border-bottom:1px solid var(--line);${p.uid===S.uid?'background:var(--glass);font-weight:700':''}"><span>${i+1}. ${esc(p.name)} ${all && top>0 && (p.score||0)===top ? '🏆' : ''}</span><span>${p.score||0}/${n} ${p.done?'':'…'}</span></div>`).join('') + `</div>`;
}
function viewMultiResult(){
  const n = QZ.list.length;
  setView(`<div class="stack" style="max-width:560px;margin:0 auto;text-align:center">
    <div style="margin-top:16px">${LOGO(72)}</div><h1>${esc(BE('মাল্টিপ্লেয়ার ফলাফল','Multiplayer result'))}</h1>
    <div class="stat" style="max-width:220px;margin:0 auto"><b style="font-size:40px">${QZ.score}/${n}</b><span>${esc(SUBJ_NAMES[QZ.subject][P.lang])}</span></div>
    <div id="mp-result"></div>
    <button class="btn ghost full" id="rh">${esc(t('leaveRoom'))}</button></div>`,{nav:false,full:true});
  Snd.play(QZ.score>=4?'achieve':'notify');
  if(currentRoom && currentRoom.data) renderMultiStandings($('#mp-result'), currentRoom.data);
  $('#rh').onclick = async ()=>{ await leaveRoom(); QZ = null; go('/multiplayer'); };
}
function viewMultiplayer(){
  setView(`<header class="row between"><button class="btn sm ghost" onclick="goBack()">←</button><h1>${esc(t('multiHead'))}</h1>${themeBtn()}</header>

const INVENTORY_ITEMS = [
  {id:'av_planet', type:'avatar', bn:'প্ল্যানেট অ্যাভাটার', en:'Planet Avatar', icon:'🪐', shape:'planet', cost:0, owned:true},
  {id:'av_rune', type:'avatar', bn:'রুন অ্যাভাটার', en:'Rune Avatar', icon:'⚡', shape:'rune', cost:500, owned:false},
  {id:'av_hex', type:'avatar', bn:'হেক্স অ্যাভাটার', en:'Hex Avatar', icon:'⬡', shape:'hex', cost:500, owned:false},
  {id:'boost_2x', type:'xpboost', bn:'২× XP বুস্ট (৩০ মিন)', en:'2× XP Boost (30 min)', icon:'⚡', cost:200, owned:false},
  {id:'theme_rose', type:'theme', bn:'রোজ থিম', en:'Rose Theme', icon:'🌹', cost:300, owned:false},
];
function ownedItems(){ return (S.priv && Array.isArray(S.priv.inv)) ? S.priv.inv : []; }
/* Spending never lowers XP/rank: balance = lifetime XP - spent */
function myBalance(){ return Math.max(0, myXp() - ((S.priv && S.priv.spent) || 0)); }
function viewInventory(){
  const owned=ownedItems();
  const equipped=(S.priv && S.priv.equipped)||'';
  const tabs=[{id:'all',bn:'সব',en:'All'},{id:'avatar',bn:'অ্যাভাটার',en:'Avatars'},{id:'xpboost',bn:'XP বুস্ট',en:'XP Boosts'},{id:'theme',bn:'থিম',en:'Themes'}];
  let activeTab='all';
  const render=()=>{
    const items=INVENTORY_ITEMS.filter(i=>activeTab==='all'||i.type===activeTab);
    const body=items.map(item=>{
      const isOwned=item.owned||owned.includes(item.id);
      const isEquipped=equipped===item.id;
      return `<div class="card" style="padding:14px;margin-bottom:10px">
        <div class="row between"><span style="font-size:26px">${item.icon}</span><div style="flex:1;margin:0 10px"><b>${esc(P.lang==='bn'?item.bn:item.en)}</b><br><small class="muted">${isOwned?esc(t('achUnlocked')):esc(t('totalXp'))+': '+item.cost+' XP'}</small></div>
        ${isOwned?(isEquipped?`<span class="pill" style="background:var(--cyan)20;color:var(--cyan)">${esc(t('invEquipped'))}</span>`:`<button class="btn sm" data-equip="${item.id}">${esc(t('invEquip'))}</button>`):`<button class="btn sm ghost" data-buy="${item.id}" ${myBalance()<item.cost?'disabled':''}>${item.cost} XP</button>`}
        </div>
      </div>`;
    }).join('');
    $('#inv-body').innerHTML=body;
    document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{ saveAccount({equipped:b.dataset.equip},{}).then(()=>viewInventory()).catch(ex=>toast(errMsg(ex),'error')); });
    document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
      const item=INVENTORY_ITEMS.find(i=>i.id===b.dataset.buy);
      if(!item||myBalance()<item.cost||ownedItems().includes(item.id)){ toast(P.lang==='bn'?'যথেষ্ট XP নেই':'Not enough XP','error'); return; }
      const prev={inv:S.priv.inv, spent:S.priv.spent};
      saveAccount({ inv:[...ownedItems(), item.id], spent:((S.priv.spent)||0)+item.cost }, {})
        .then(()=>{ Snd.play('achieve'); toast(P.lang==='bn'?'আনলক হয়েছে!':'Unlocked!','ok'); viewInventory(); })
        .catch(ex=>{ S.priv.inv=prev.inv; S.priv.spent=prev.spent; toast(errMsg(ex),'error'); });
    });
  };
  setView(`<header class="row between"><button class="btn sm ghost" onclick="goBack()">←</button><h1>${esc(t('invHead'))}</h1><span class="pill">${myBalance()} XP</span></header>
  <div class="row" style="gap:8px;margin:12px 0;flex-wrap:wrap">${tabs.map(tb=>`<button class="chip ${activeTab===tb.id?'active':''}" data-itab="${tb.id}">${esc(P.lang==='bn'?tb.bn:tb.en)}</button>`).join('')}</div>
  <div id="inv-body"></div>`);
  render();
  document.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.itab; document.querySelectorAll('[data-itab]').forEach(x=>x.classList.toggle('active',x.dataset.itab===activeTab)); render(); });
}

/* PWA manifest + service worker registration */
(function initPWA(){
  const manifest={name:'Levelup Academy',short_name:'LevelUp',start_url:'.',display:'standalone',background_color:'#0f0f17',theme_color:'#00c7ff',
    icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2300c7ff"/><text y="44" x="10" font-size="40" fill="white">🎓</text></svg>',sizes:'64x64',type:'image/svg+xml'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link'); link.rel='manifest'; link.href=url;
  document.head.appendChild(link);
  if('serviceWorker' in navigator){
    const sw=`const C='lu-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['.']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{caches.open(C).then(c=>c.put(e.request,res.clone()));return res;}))));`;
    const swBlob=new Blob([sw],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
})();

      try{
        const snap=await fbDb.collection('adminRoles').get();
        rd.innerHTML=snap.empty?`<p class="muted">${P.lang==='bn'?'কোনো অ্যাডমিন নেই':'No admins'}</p>`:
          snap.docs.map(d=>`<div class="row between" style="padding:4px 0"><code style="font-size:12px">${esc(d.id)}</code><span class="pill">admin</span></div>`).join('');
      } catch(e){ rd.innerHTML=`<p class="muted">${e.message}</p>`; }
    })();
  } else {
    $('#adm-stats').innerHTML=`<p class="muted">${P.lang==='bn'?'Preview মোডে লাইভ ডাটা নেই':'No live data in preview mode'}</p>`;
    $('#adm-roles').innerHTML=`<p class="muted">Preview mode</p>`;
  }

  $('#adm-srch').onclick=async()=>{
    const ud=$('#adm-user'); const pid=$('#adm-pid').value.trim().padStart(9,'0');
    ud.innerHTML=`<p class="muted">${esc(t('loading'))}</p>`;
    if(S.mode!=='fb'){ ud.innerHTML=`<p class="muted">${P.lang==='bn'?'Firebase প্রয়োজন':'Firebase required'}</p>`; return; }
    try{
      const snap=await fbDb.collection('playerIds').doc(pid).get();
      if(!snap.exists){ ud.innerHTML=`<p class="muted">${esc(t('notFound2'))}</p>`; return; }
      const {uid}=snap.data();
      const [usnap,psnap]=await Promise.all([fbDb.collection('users').doc(uid).get(), fbDb.collection('profiles').doc(uid).get()]);
      const u=usnap.data()||{}, p=psnap.data()||{};
      ud.innerHTML=`<div class="card" style="padding:10px 14px"><b>${esc(p.displayName||'—')}</b> · <span class="muted">${esc(pid)}</span><br>
        <small>${P.lang==='bn'?'ক্লাস':'Class'}: ${u.class||'—'} · XP: ${p.xp||0} · ${rankName(p.xp||0)}${u.banned?' · <b>BANNED</b>':''}</small><br>
        <small class="muted">UID: ${esc(uid)}</small>
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn sm ghost" data-ban="${uid}">${u.banned?(P.lang==='bn'?'ব্লক তুলুন':'Unban'):(P.lang==='bn'?'অ্যাকাউন্ট ব্লক':'Ban account')}</button>
          <button class="btn sm danger" data-reset-xp="${uid}">${P.lang==='bn'?'XP রিসেট':'Reset XP'}</button>
        </div></div>`;
      ud.querySelector('[data-ban]').onclick=async()=>{
        const bn=P.lang==='bn', ban=!u.banned;
        if(!confirm(ban?(bn?'এই অ্যাকাউন্ট ব্লক করবেন?':'Ban this account?'):(bn?'ব্লক তুলে নেবেন?':'Unban this account?'))) return;
        try{ await fbDb.collection('users').doc(uid).update({banned:ban}); u.banned=ban; toast(ban?(bn?'ব্লক করা হয়েছে':'Banned'):(bn?'ব্লক তোলা হয়েছে':'Unbanned'),'ok'); $('#adm-srch').click(); }
        catch(e){ toast((e&&e.code==='functions/not-found')?(bn?'Cloud Function ডিপ্লয় করা নেই':'Cloud Function not deployed'):errMsg(e),'error'); }
      };
      ud.querySelector('[data-reset-xp]').onclick=async()=>{
        try{ await fbDb.collection('profiles').doc(uid).update({xp:0}); toast(P.lang==='bn'?'XP রিসেট হয়েছে':'XP reset','ok'); }catch(e){ toast(errMsg(e),'error'); }
      };
    } catch(e){ ud.innerHTML=`<p class="muted">${e.message}</p>`; }
  };
  $('#adm-send').onclick=async()=>{
    const msg=$('#adm-ann').value.trim(); if(!msg) return;
    if(S.mode!=='fb'){ toast(P.lang==='bn'?'Firebase প্রয়োজন':'Firebase required','error'); return; }
    try{
      await fbDb.collection('announcements').add({msg, createdAt:firebase.firestore.FieldValue.serverTimestamp(), by:S.uid});
      toast(P.lang==='bn'?'পাঠানো হয়েছে':'Sent','ok'); $('#adm-ann').value='';
    } catch(e){ toast(errMsg(e),'error'); }
  };
}

/* ---------- QUESTION BANK LOADER ---------- */
let REMOTE_BANK = {};     // admin-managed questions from Firestore questionBank/{class}_{subject}; they win over embedded/local ones
function loadBank(){
  let local = {}; try{ local = JSON.parse(localStorage.getItem('lu_bank') || '{}'); }catch(e){}
  setCustomBank(mergeBanks(REMOTE_BANK, mergeBanks(EMBEDDED_BANK, local)));
}
async function loadRemoteBank(force){
  const v = S.cfg && S.cfg.bankVersion; if(!v || !fbDb) return;      // no admin edits yet => no reads at all
  let cache = null; try{ cache = JSON.parse(localStorage.getItem('lu_bank_remote') || 'null'); }catch(e){}
  if(!force && cache && cache.v === v){ REMOTE_BANK = cache.data || {}; return loadBank(); }
  try{
    const snap = await fbDb.collection('questionBank').get(), data = {};
    snap.forEach(d => { const x = d.data(); if(x && Array.isArray(x.questions) && x.questions.length){ (data[x.cls] = data[x.cls] || {})[x.subject] = x.questions; } });
    REMOTE_BANK = data; try{ localStorage.setItem('lu_bank_remote', JSON.stringify({ v, data })); }catch(e){}
    loadBank();
  }catch(e){ if(cache){ REMOTE_BANK = cache.data || {}; loadBank(); } }
}

/* ---------- BOOT ---------- */
let booted = false;
async function boot(){
  applyPrefs(); loadBank();
  viewSplash();
  await new Promise(r=>setTimeout(r, P.motion==='reduced'?300:1300));
  viewLoading();
  try{
    if(FB_ENABLED){
      await withTimeout(initFirebase(), 12000);
      await withTimeout(loadAppConfig(), 6000).catch(()=>{});
      await withTimeout(loadRemoteBank(), 8000).catch(()=>{});
      setInterval(()=>loadAppConfig().then(()=>loadRemoteBank()), 300000);
      const first = await withTimeout(new Promise(res=>{ const un = fbAuth.onAuthStateChanged(u=>{ un(); res(u); }); }), 12000);
      if(first) await withTimeout(onAuthUser(first), 15000);
      fbAuth.onAuthStateChanged(async u=>{ if(!booted) return;                       // later changes (login/logout)
        try{ await onAuthUser(u); }catch(e){ toast(errMsg(e),'error'); }
        route(); });
    } else { loadPreview(); }
  }catch(e){ console.error(e); return viewLoadError(e && (e.code||e.message)); }
  booted = true;
  const h = hashPath();
  memPath = (h && h!=='/') ? h : '/';
  route();
}
async function safeBoot(){
  const watchdog = setTimeout(()=>{ if(loadingShown) viewLoadError('timeout'); }, 25000);   // never stay on the loading screen forever
  try{ await boot(); }catch(e){ console.error(e); showFatal(e); }
  clearTimeout(watchdog);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', safeBoot); else safeBoot();   // not 'load': slow fonts would block it
window.addEventListener('error', e=>{ console.error(e.error||e.message); if(!booted || loadingShown) showFatal(e.error||e.message); });
window.addEventListener('unhandledrejection', e=>{ console.error(e.reason); if(!booted || loadingShown) showFatal(e.reason); });
</script>
